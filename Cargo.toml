[package]
name = "quiz-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.3.1"
actix-rt = "2.8.0"
sqlx = { version = "0.7", features = ["mysql", "runtime-tokio", "chrono"] }
serde = "1.0.185"
serde_json = "1.0.105"
uuid = { version = "1.4.1", features = ["serde", "v4"] }
actix-cors = "0.6.4"
http = "0.2"
futures = "0.3"
futures-util = "0.3"
supabase-auth = "0.9.1"
dotenv = "0.15.0"
jsonwebtoken = "9.3.0"
reqwest = { version = "0.11", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
utoipa = { version = "4", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "6", features = ["actix-web"] }
oauth2 = "4.4.2"
url = "2.4.1"
base64 = "0.21.5"
thiserror = "1.0.50"
tokio = { version = "1", features = ["full"] }
urlencoding = "2.1.3"
log = "0.4.20"
env_logger = "0.10.1"
redis = { version = "0.24", features = ["aio", "tokio-comp", "connection-manager"] }
md5 = "0.7"
csv = "1.3"
actix-multipart = "0.6"
tempfile = "3.8"
regex = "1.10"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"


[profile.dev.build-override]
opt-level = 3

[profile.release]
panic = "unwind"  # Strip expensive panic clean-up logic
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true        # Enables link to optimizations
opt-level = "s"   # Optimize for binary size
strip = true      # Remove debug symbols
split-debuginfo = "unpacked"
