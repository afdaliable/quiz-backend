name: CI Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Get version from commit count
      id: version
      run: echo "VERSION=v$(git rev-list --count HEAD)" >> $GITHUB_ENV

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN }}

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      run: |
        docker build -t ghcr.io/${{ github.repository }}/quiz-backend:latest -t ghcr.io/${{ github.repository }}/quiz-backend:${{ env.VERSION }} .
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/quiz-backend:latest .

        docker push ghcr.io/${{ github.repository }}/quiz-backend:latest
        docker push ghcr.io/${{ github.repository }}/quiz-backend:${{ env.VERSION }}

        docker push ${{ secrets.DOCKERHUB_USERNAME }}/quiz-backend:latest

    - name: Delete old images from GHCR
      run: |
        gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}"
        REPO="ghcr.io/${{ github.repository }}/quiz-backend"
        IMAGES=$(gh api "orgs/${{ github.repository_owner }}/packages/container/quiz-backend/versions" | jq -r '.[].id' | tail -n +3)
        for IMG in $IMAGES; do
          gh api --method DELETE "orgs/${{ github.repository_owner }}/packages/container/quiz-backend/versions/$IMG"
        done
  
  deploy:
    name: Deploy ke Server
    needs: build 
    runs-on: self-hosted  
    steps:
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull Image Baru
        run: docker pull ghcr.io/afdaliable/quiz-backend-prod/quiz-backend:latest

      - name: Hentikan & Hapus Container Lama
        run: |
          docker stop quiz-backend || true
          docker rm quiz-backend || true

      - name: Jalankan Container Baru
        run: |
          docker run -d --name quiz-backend -p 8787:8787 \
            -v /docker/quiz-backend/app/config.json:/app/config.json \
            ghcr.io/afdaliable/quiz-backend-prod:latest