name: CI Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build Rust project
      run: cargo build --release

    - name: Run tests
      run: cargo test

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      run: |
        docker build -t ghcr.io/${{ github.repository }}/rust-app:latest .

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Push Docker image to GHCR
      run: |
        docker push ghcr.io/${{ github.repository }}/rust-app:latest

    - name: Deploy to Synology via SSH
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_PORT: ${{ secrets.SSH_PORT }}
        SSH_USER: ${{ secrets.SSH_USER }}
      run: |
        echo "$SSH_PRIVATE_KEY" > private_key.pem
        chmod 600 private_key.pem
        ssh -i private_key.pem -o StrictHostKeyChecking=no -p $SSH_PORT $SSH_USER@$SSH_HOST "
          docker pull ghcr.io/${{ github.repository }}/rust-app:latest &&
          docker stop rust-app || true &&
          docker rm rust-app || true &&
          docker run -d --name rust-app -p 8787:8787 ghcr.io/${{ github.repository }}/rust-app:latest
        "
        rm -f private_key.pem
